<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>אין חיבור · קצביית הרימון</title>
    <link rel="icon" href="/icon.svg" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem calc(1rem + env(safe-area-inset-right)) 2rem calc(1rem + env(safe-area-inset-left));
        background: #f3f0ea;
        color: #1b1916;
        font-family: "Assistant", "Heebo", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main {
        max-width: 28rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      h1 {
        font-family: "Frank Ruhl Libre", Georgia, "Times New Roman", serif;
        font-weight: 300;
        font-size: clamp(2rem, 8vw, 3rem);
        margin: 0;
      }
      p {
        margin: 0;
        font-size: 1.0625rem;
        line-height: 1.7;
        color: #3a342e;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 3rem;
        padding-inline: 1.5rem;
        background: #1b1916;
        color: #faf8f4;
        text-decoration: none;
        font-weight: 600;
        border-radius: 2px;
      }
      hr {
        width: 3rem;
        height: 1px;
        border: 0;
        background: #a8864e;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" width="56" height="56" />
      <hr />
      <h1>אין חיבור לרשת</h1>
      <p>
        הטלפון לא מצליח להגיע לחנות כרגע. המחירים, המלאי ומועדי המשלוח משתנים במהלך היום, ולכן אנחנו לא
        מציגים אותם מהזיכרון — עדיף בלי מידע מאשר עם מידע לא נכון.
      </p>
      <p>ברגע שהחיבור חוזר, אפשר להמשיך בדיוק מאותו מקום.</p>
      <a href="/he">ניסיון נוסף</a>
    </main>
  </body>
</html>
